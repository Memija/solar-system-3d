<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Solar System 3D</title>
    <meta name="description" content="Interactive 3D real-time simulation and astronomical observatory of our Solar System featuring planets, moons, constellations, and space missions." />
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Solar System 3D — Deep Space Observatory" />
    <meta property="og:description" content="Interactive 3D real-time simulation and astronomical observatory of our Solar System." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;600;800;900&family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap&subset=latin,latin-ext,cyrillic" rel="stylesheet" />
    <style id="critical-loading-css">
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        z-index: 99999;
        background: radial-gradient(circle at 50% 45%, rgba(14, 28, 54, 0.96) 0%, rgba(5, 10, 24, 0.98) 60%, #030712 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        color: rgba(248, 250, 252, 0.92);
        font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        transition: opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1), transform 0.75s cubic-bezier(0.16, 1, 0.3, 1), filter 0.75s ease;
        will-change: opacity, transform, filter;
      }
      .loading-screen.is-complete {
        opacity: 0;
        transform: scale(1.05);
        filter: blur(8px);
        pointer-events: none;
      }
      .loading-screen.is-hidden {
        display: none !important;
      }
      .loading-screen::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: 
          radial-gradient(1.5px 1.5px at 15% 20%, rgba(255, 255, 255, 0.7) 0%, transparent 100%),
          radial-gradient(1px 1px at 40% 70%, rgba(56, 189, 248, 0.6) 0%, transparent 100%),
          radial-gradient(2px 2px at 75% 25%, rgba(245, 158, 11, 0.7) 0%, transparent 100%),
          radial-gradient(1.5px 1.5px at 85% 80%, rgba(129, 140, 248, 0.6) 0%, transparent 100%),
          radial-gradient(1px 1px at 25% 85%, rgba(255, 255, 255, 0.5) 0%, transparent 100%),
          radial-gradient(2px 2px at 60% 15%, rgba(16, 185, 129, 0.6) 0%, transparent 100%);
        opacity: 0.65;
        pointer-events: none;
        animation: starTwinkle 4s ease-in-out infinite alternate;
      }
      .loading-screen::after {
        content: '';
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.85);
        pointer-events: none;
      }
      .loading-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 480px;
        width: 90%;
        padding: 20px;
      }
      .loading-orrery {
        position: relative;
        width: 260px;
        height: 260px;
        margin-bottom: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 800px;
        transform-style: preserve-3d;
      }
      .loading-sun {
        position: absolute;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #fff 0%, #fde047 30%, #f59e0b 70%, #d97706 100%);
        box-shadow: 0 0 25px rgba(245, 158, 11, 0.8), 0 0 50px rgba(245, 158, 11, 0.4), 0 0 80px rgba(251, 191, 36, 0.25);
        animation: sunPulse 3s ease-in-out infinite alternate;
        z-index: 10;
      }
      .loading-sun-corona {
        position: absolute;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        border: 1px solid rgba(245, 158, 11, 0.35);
        box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        animation: coronaPulse 2.4s ease-in-out infinite;
        z-index: 9;
      }
      .loading-orbit-system {
        position: absolute;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: rotateX(68deg) rotateY(-12deg);
        transform-style: preserve-3d;
      }
      .loading-orbit-ring {
        position: absolute;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-style: preserve-3d;
      }
      .loading-orbit-ring.ring-inner {
        width: 100px;
        height: 100px;
        border: 1px solid rgba(56, 189, 248, 0.4);
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
        animation: ringSpin 3.2s linear infinite;
      }
      .loading-orbit-ring.ring-inner .loading-planet {
        width: 8px;
        height: 8px;
        background: #38bdf8;
        box-shadow: 0 0 12px #38bdf8, 0 0 20px rgba(56, 189, 248, 0.8);
        transform: translateY(-50px);
      }
      .loading-orbit-ring.ring-middle {
        width: 168px;
        height: 168px;
        border: 1px dashed rgba(16, 185, 129, 0.35);
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.12);
        animation: ringSpinCounter 6.5s linear infinite;
      }
      .loading-orbit-ring.ring-middle .loading-planet {
        width: 11px;
        height: 11px;
        background: #10b981;
        box-shadow: 0 0 14px #10b981, 0 0 24px rgba(16, 185, 129, 0.7);
        transform: translateY(-84px);
      }
      .loading-orbit-ring.ring-outer {
        width: 236px;
        height: 236px;
        border: 1px solid rgba(129, 140, 248, 0.3);
        box-shadow: 0 0 16px rgba(129, 140, 248, 0.1);
        animation: ringSpin 11s linear infinite;
      }
      .loading-orbit-ring.ring-outer .loading-planet {
        width: 9px;
        height: 9px;
        background: #f59e0b;
        box-shadow: 0 0 12px #f59e0b, 0 0 22px rgba(245, 158, 11, 0.8);
        transform: translateY(-118px);
      }
      .loading-planet {
        position: absolute;
        border-radius: 50%;
        transform-style: preserve-3d;
      }
      .loading-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px;
        border-radius: 9999px;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(56, 189, 248, 0.28);
        font-family: 'Orbitron', 'Space Grotesk', monospace, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: #38bdf8;
        text-transform: uppercase;
        margin-bottom: 12px;
        backdrop-filter: blur(8px);
      }
      .status-live-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: #10b981;
        box-shadow: 0 0 8px #10b981;
        animation: livePulse 1.8s ease-in-out infinite;
      }
      .loading-title {
        font-family: 'Orbitron', 'Space Grotesk', monospace, sans-serif;
        font-size: clamp(20px, 5vw, 26px);
        font-weight: 800;
        letter-spacing: 0.22em;
        color: #f8fafc;
        text-align: center;
        margin: 0 0 6px 0;
        text-shadow: 0 0 20px rgba(56, 189, 248, 0.4), 0 2px 4px rgba(0, 0, 0, 0.8);
      }
      .loading-subtitle {
        font-family: 'Space Grotesk', -apple-system, sans-serif;
        font-size: clamp(11px, 2.8vw, 12px);
        font-weight: 500;
        letter-spacing: 0.18em;
        color: rgba(148, 163, 184, 0.85);
        text-transform: uppercase;
        text-align: center;
        margin: 0 0 24px 0;
      }
      .loading-progress-wrapper {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .loading-status-text {
        font-family: 'Orbitron', 'Space Grotesk', monospace, sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.12em;
        color: #38bdf8;
        text-align: center;
        text-transform: uppercase;
        min-height: 18px;
        opacity: 0.95;
        transition: color 0.3s ease;
      }
      .loading-status-text.status-complete {
        color: #10b981;
        text-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
      }
      .loading-progress-bar-container {
        position: relative;
        width: 100%;
        height: 8px;
        border-radius: 9999px;
        background: rgba(9, 14, 28, 0.85);
        border: 1px solid rgba(56, 189, 248, 0.25);
        overflow: hidden;
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8), 0 0 15px rgba(56, 189, 248, 0.08);
      }
      .loading-progress-bar {
        height: 100%;
        width: 0%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #2563eb 0%, #38bdf8 50%, #818cf8 100%);
        box-shadow: 0 0 14px rgba(56, 189, 248, 0.7);
        transition: none;
        position: relative;
        overflow: hidden;
      }

      .loading-progress-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: -50%;
        width: 50%;
        height: 100%;
        background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.8) 50%, transparent 100%);
        animation: progressShimmer 1.5s ease-in-out infinite;
      }
      .loading-telemetry-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: 'Orbitron', 'Space Grotesk', monospace, sans-serif;
        font-size: 11px;
        letter-spacing: 0.1em;
        color: rgba(148, 163, 184, 0.85);
        padding: 0 2px;
      }
      .loading-percentage {
        color: #f8fafc;
        font-weight: 700;
      }
      .loading-subsystems {
        font-size: 10px;
        opacity: 0.8;
      }
      @keyframes ringSpin {
        from { transform: rotateZ(0deg); }
        to { transform: rotateZ(360deg); }
      }
      @keyframes ringSpinCounter {
        from { transform: rotateZ(360deg); }
        to { transform: rotateZ(0deg); }
      }
      @keyframes sunPulse {
        0% { transform: scale(0.96); box-shadow: 0 0 22px rgba(245, 158, 11, 0.75), 0 0 45px rgba(245, 158, 11, 0.35); }
        100% { transform: scale(1.05); box-shadow: 0 0 32px rgba(245, 158, 11, 0.9), 0 0 65px rgba(245, 158, 11, 0.5); }
      }
      @keyframes coronaPulse {
        0% { transform: scale(0.88); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 0.3; }
        100% { transform: scale(1.3); opacity: 0; }
      }
      @keyframes livePulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes starTwinkle {
        0% { opacity: 0.5; }
        100% { opacity: 0.85; }
      }
      @keyframes progressShimmer {
        0% { left: -50%; }
        100% { left: 150%; }
      }
      @media (max-width: 480px) {
        .loading-orrery { width: 210px; height: 210px; margin-bottom: 20px; }
        .loading-orbit-ring.ring-inner { width: 80px; height: 80px; }
        .loading-orbit-ring.ring-inner .loading-planet { transform: translateY(-40px); }
        .loading-orbit-ring.ring-middle { width: 135px; height: 135px; }
        .loading-orbit-ring.ring-middle .loading-planet { transform: translateY(-67px); }
        .loading-orbit-ring.ring-outer { width: 190px; height: 190px; }
        .loading-orbit-ring.ring-outer .loading-planet { transform: translateY(-95px); }
      }
    </style>
  </head>
  <body>
    <div id="loading-screen" class="loading-screen">
      <div class="loading-content">
        <div class="loading-badge">
          <span class="status-live-dot"></span>
          <span>Observatory Boot</span>
        </div>
        <div class="loading-orrery">
          <div class="loading-sun"></div>
          <div class="loading-sun-corona"></div>
          <div class="loading-orbit-system">
            <div class="loading-orbit-ring ring-inner">
              <div class="loading-planet"></div>
            </div>
            <div class="loading-orbit-ring ring-middle">
              <div class="loading-planet"></div>
            </div>
            <div class="loading-orbit-ring ring-outer">
              <div class="loading-planet"></div>
            </div>
          </div>
        </div>
        <h1 class="loading-title">SOLAR SYSTEM 3D</h1>
        <p class="loading-subtitle">Deep Space Astronomical Observatory</p>
        <div class="loading-progress-wrapper">
          <div class="loading-status-text">INITIALIZING OBSERVATORY CORE...</div>
          <div class="loading-progress-bar-container">
            <div class="loading-progress-bar"></div>
          </div>
          <div class="loading-telemetry-row">
            <span class="loading-percentage">0%</span>
            <span class="loading-subsystems">STANDBY</span>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function() {
        var lang = 'en';
        try {
          var stored = localStorage.getItem('solar_system_language');
          if (stored) {
            lang = stored;
          } else if (navigator.language) {
            var bl = navigator.language.toLowerCase();
            if (bl.startsWith('id')) lang = 'id';
            else if (bl.startsWith('bs') || bl.startsWith('hr') || bl.startsWith('sh') || bl.startsWith('cnr')) lang = 'bs';
            else if (bl.startsWith('de')) lang = 'de';
            else if (bl.startsWith('pl')) lang = 'pl';
            else if (bl.startsWith('sr')) lang = 'sr';
          }
        } catch (e) {}

        var dict = {
          en: {
            boot: 'Observatory Boot',
            subtitle: 'Deep Space Astronomical Observatory',
            core: 'INITIALIZING OBSERVATORY CORE...',
            standby: 'STANDBY',
            connecting: 'CONNECTING'
          },
          bs: {
            boot: 'Pokretanje opservatorije',
            subtitle: 'Astronomski opservatorij dubokog svemira',
            core: 'INICIJALIZACIJA JEZGRA OPSERVATORIJE...',
            standby: 'PRIPRAVNOST',
            connecting: 'POVEZIVANJE'
          },
          de: {
            boot: 'Observatorium-Start',
            subtitle: 'Astronomisches Tiefenraum-Observatorium',
            core: 'INITIALISIERUNG DES OBSERVATORIUM-KERNS...',
            standby: 'STANDBY',
            connecting: 'VERBINDEN'
          },
          id: {
            boot: 'Memulai Observatorium',
            subtitle: 'Observatorium Astronomi Luar Angkasa',
            core: 'MENGINISIALISASI INTI OBSERVATORIUM...',
            standby: 'SIAGA',
            connecting: 'MENGHUBUNGKAN'
          },
          pl: {
            boot: 'Rozruch obserwatorium',
            subtitle: 'Astronomiczne obserwatorium głębokiego kosmosu',
            core: 'INICJALIZACJA RDZENIA OBSERWATORIUM...',
            standby: 'OCZEKIWANIE',
            connecting: 'ŁĄCZENIE'
          },
          sr: {
            boot: 'Покретање опсерваторије',
            subtitle: 'Астрономска опсерваторија дубоког свемира',
            core: 'ИНИЦИЈАЛИЗАЦИЈА ЈЕЗГРА ОПСЕРВАТОРИЈЕ...',
            standby: 'ПРИПРАВНОСТ',
            connecting: 'ПОВЕЗИВАЊЕ'
          }
        };

        var t = dict[lang] || dict.en;
        var badge = document.querySelector('.loading-badge span:last-child');
        if (badge) badge.textContent = t.boot;
        var sub = document.querySelector('.loading-subtitle');
        if (sub) sub.textContent = t.subtitle;
        var sText = document.querySelector('.loading-status-text');
        if (sText) sText.textContent = t.core;
        var subText = document.querySelector('.loading-subsystems');
        if (subText) subText.textContent = t.standby;

        var pBar = document.querySelector('.loading-progress-bar');
        var pText = document.querySelector('.loading-percentage');
        if (!pBar || !pText) return;
        var cur = 0;
        var maxInitial = 22;
        var timer = setInterval(function() {
          if (window.loadingScreenInitialized) {
            clearInterval(timer);
            return;
          }
          if (cur < maxInitial) {
            cur += 1.2;
            pBar.style.width = cur + '%';
            pText.textContent = Math.round(cur) + '%';
            if (cur > 10 && subText) subText.textContent = t.connecting;
          }
        }, 35);
      })();
    </script>
    <div id="app"></div>
    <div id="ui-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
